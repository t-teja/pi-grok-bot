# Default config for pi-grok-bot. Copy to config.yaml and edit.
# Secrets live in .env (XAI_API_KEY), never in this file.

app:
  name: "Grok Bot"
  user_name: "Teja"
  host: "127.0.0.1"
  port: 8080
  # DEV_MODE: typed input, mock STT/TTS if models/hardware missing.
  # Forced on when GROK_BOT_DEV=1 / DEV_MODE=1, or when not running on a Pi.
  dev_mode: false
  data_dir: "data"

grok:
  # Current xAI flagship (OpenAI-compatible Chat Completions). Override with GROK_MODEL.
  # See https://docs.x.ai/developers/models
  model: "grok-4.6"
  base_url: "https://api.x.ai/v1"
  temperature: 0.7
  max_tokens: 1024
  # Keep spoken replies short; the kiosk reads them aloud.
  system_prompt: |
    You are Grok, a helpful and maximally truthful AI living on Teja's Raspberry Pi
    kiosk. You are an unofficial companion — not the Cursor Grok Bot PC/iOS app.
    Speak like a character in the room: concise, a little witty, never sycophantic.
    Prefer 1–3 short sentences when a reply will be spoken aloud.
    Use tools for Pi actions (time, stats, volume, timers, music, screenshots,
    allowlisted commands, opening URLs). Never claim you ran a command unless a
    tool result confirms it. If a tool fails, say so plainly.

audio:
  sample_rate: 16000
  stt:
    engine: "vosk"          # vosk | mock
    model_dir: "models/vosk-model-small-en-us-0.15"
    mock_transcript: ""
  tts:
    engine: "piper"         # piper | espeak | mock
    voice: "en_US-lessac-medium"
    model_path: "models/en_US-lessac-medium.onnx"
  wake_word:
    enabled: true
    phrase: "hey grok"
  tap_to_talk: true

kiosk:
  url: "http://127.0.0.1:8080/"
  chromium_flags:
    - "--kiosk"
    - "--noerrdialogs"
    - "--disable-infobars"
    - "--disable-session-crashed-bubble"
    - "--check-for-update-interval=31536000"
    - "--autoplay-policy=no-user-gesture-required"

tools:
  music_dir: "data/music"
  screenshot_dir: "data/screenshots"
  command_timeout_sec: 15
  allowlist:
    - name: uptime
      argv: ["uptime"]
      description: "Show system uptime"
    - name: whoami
      argv: ["whoami"]
      description: "Show the current user"
    - name: df
      argv: ["df", "-h", "/"]
      description: "Disk free space on root"
    - name: hostname
      argv: ["hostname"]
      description: "Machine hostname"
